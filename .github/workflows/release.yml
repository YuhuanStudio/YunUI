name: Release

# Push a version tag (e.g. v0.1.6) → GitHub Actions builds + publishes to npm.
# Auth is tokenless via npm OIDC "Trusted Publishing": configure the package
# on npmjs.com (Settings → Trusted Publisher → GitHub Actions, repo
# YuhuanStudio/YunUI, workflow release.yml). No NPM_TOKEN secret needed.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release
  id-token: write # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package.json version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"; exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Lint package (publint)
        run: pnpm exec publint

      # Trusted Publishing (OIDC) requires npm >= 11.5.1; node 22 ships an older npm.
      - name: Update npm (for OIDC trusted publishing)
        run: npm install -g npm@latest

      - name: Publish to npm (tokenless OIDC + provenance)
        run: npm publish --provenance --access public

      # Create the GitHub Release from this version's CHANGELOG section, so the
      # Releases page stays in sync with npm without a manual `gh release create`.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Slice out the "## [VERSION] ..." section up to the next "## [" heading.
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ -s RELEASE_NOTES.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --notes-file RELEASE_NOTES.md --verify-tag --latest
          else
            echo "::warning::No CHANGELOG section for $VERSION; using auto-generated notes"
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" \
              --generate-notes --verify-tag --latest
          fi
